spring:
  application:
    name: pension-administration-platform
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pension_db}
      auto-index-creation: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.pension: DEBUG
    org.springframework.data.mongodb: INFO